apiVersion: v1
kind: Secret
metadata:
  name: crossmind-secret
  namespace: crossmind
  labels:
    app.kubernetes.io/name: crossmind
    app.kubernetes.io/component: api
  annotations:
    crossmind.io/secret-template: "true"
type: Opaque
stringData:
  API_KEY: "${API_KEY}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
  DASHBOARD_API_KEY: "${DASHBOARD_API_KEY}"
  OPENAI_API_KEY: "${OPENAI_API_KEY}"
