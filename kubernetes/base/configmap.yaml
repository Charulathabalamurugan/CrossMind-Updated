apiVersion: v1
kind: ConfigMap
metadata:
  name: crossmind-config
  namespace: crossmind
  labels:
    app.kubernetes.io/name: crossmind
    app.kubernetes.io/component: api
data:
  ENVIRONMENT: production
  HOST: 0.0.0.0
  PORT: "8000"
  QDRANT_HOST: crossmind-qdrant
  QDRANT_PORT: "6333"
  QDRANT_IN_MEMORY: "false"
  QDRANT_COLLECTION_NAME: crossmind_knowledge
  REDIS_HOST: crossmind-redis
  REDIS_PORT: "6379"
  REDIS_QUERY_CACHE_TTL: "3600"
  NEO4J_ENABLED: "true"
  NEO4J_URI: bolt://crossmind-neo4j:7687
  NEO4J_USER: neo4j
  OPENTELEMETRY_EXPORTER: http://crossmind-jaeger:4317
  ZAYA1_8B_API_BASE: http://crossmind-vllm:8001/v1
  USE_LOCAL_SIMULATOR_FALLBACK: "true"
  PROMETHEUS_ENABLED: "true"
  PROMETHEUS_PORT: "9090"
  ALLOWED_ORIGINS: https://crossmind.example.com
  MAX_REQUEST_SIZE_MB: "10"
  MAX_QUERY_LENGTH: "5000"
  RATE_LIMIT_PER_MINUTE: "1000"
  STREAMLIT_DASHBOARD_ENABLED: "false"
  DISK_CACHE_PATH: /tmp/crossmind_disk_cache
  DLDB_PATH: /var/lib/crossmind/dldb
