services:
  redis:
    image: redis:7-alpine
    container_name: crossmind-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: crossmind-qdrant
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_storage:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.18
    container_name: crossmind-neo4j
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/neo4jpass
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1g
    volumes: ["neo4j_data:/data", "neo4j_logs:/logs"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: crossmind-jaeger
    ports: ["16686:16686", "4317:4317", "4318:4318"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  vllm:
    image: vllm/vllm-openai:latest
    container_name: crossmind-vllm
    command: >
      python -m vllm.entrypoints.openai.api_server
      --model Qwen/Qwen2.5-7B-Instruct
      --host 0.0.0.0
      --port 8001
      --max-num-seqs 2
      --gpu-memory-utilization 0.9
      --max-model-len 16384
    ports: ["8001:8001"]
    environment:
      HF_HUB_ENABLE_HF_TRANSFER: "1"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    profiles: ["gpu"]

  api:
    build: .
    container_name: crossmind-api
    ports: ["8000:8000"]
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_IN_MEMORY: "False"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NEO4J_ENABLED: "True"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4jpass
      OPENTELEMETRY_EXPORTER: http://jaeger:4317
      ZAYA1_8B_API_BASE: http://vllm:8001/v1
      USE_LOCAL_SIMULATOR_FALLBACK: "True"
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: crossmind-dashboard
    ports: ["8501:8501"]
    environment:
      API_BASE: http://api:8000
    depends_on:
      api:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: crossmind-prometheus
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_storage:/prometheus
    depends_on:
      api:
        condition: service_started

  grafana:
    image: grafana/grafana:11.1.0
    container_name: crossmind-grafana
    ports: ["3000:3000"]
    volumes:
      - grafana_storage:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]

volumes:
  redis_data:
  qdrant_storage:
  neo4j_data:
  neo4j_logs:
  prometheus_storage:
  grafana_storage:
