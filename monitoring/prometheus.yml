global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: crossmind-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api
          environment: production

  - job_name: crossmind-qdrant
    metrics_path: /metrics
    static_configs:
      - targets: ["qdrant:6333"]
        labels:
          service: qdrant

  - job_name: crossmind-redis
    metrics_path: /metrics
    static_configs:
      - targets: ["redis:6379"]
        labels:
          service: redis

  - job_name: crossmind-neo4j
    metrics_path: /metrics
    static_configs:
      - targets: ["neo4j:2004"]
        labels:
          service: neo4j

  - job_name: crossmind-vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm:8001"]
        labels:
          service: vllm

  - job_name: crossmind-grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          service: grafana

  - job_name: crossmind-prometheus
    metrics_path: /metrics
    static_configs:
      - targets: ["prometheus:9090"]
        labels:
          service: prometheus
